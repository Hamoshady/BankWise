vision:
  max_image_bytes: 10485760
  max_pixels: 40000000
  max_working_side: 2400
  min_width: 800
  min_height: 480
  sharpness_reference_width: 1000
  min_sharpness: 60.0
  min_brightness: 70.0
  max_brightness: 235.0
  max_dark_ratio: 0.35
  max_bright_ratio: 0.8
  max_glare_ratio: 0.06
  card_aspect_ratio: 1.586
  aspect_tolerance: 0.2
  min_card_area_ratio: 0.2
  min_detection_confidence: 0.5
  canonical_width: 1012
  canonical_height: 638
  detection_side: 900


reader:
  provider: gemini
  model: gemini-3.7-flash
  allow_cloud: true
  api_key_env: BANKWISE_VLM_API_KEY
  base_url: http://localhost:11434
  timeout_seconds: 240.0
  max_retries: 6
  retry_initial_delay: 3.0
  retry_max_delay: 30.0
  max_image_side: 1600
  jpeg_quality: 92
  zoom_scale: 1.6
  min_agreeing_reads: 2
  front_zoom_regions:
    - [0.0, 0.60, 1.0, 1.0]
    - [0.35, 0.62, 1.0, 0.92]
  front_text_regions:
    - [0.30, 0.22, 1.0, 0.70]
  back_zoom_regions:
    - [0.0, 0.0, 1.0, 0.4]
  back_text_regions:
    - [0.0, 0.15, 1.0, 0.62]
  collect_sensitive_fields: true