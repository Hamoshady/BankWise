# Role-based access control. Anything not granted here is denied.
# A role grants exact permissions or a whole domain with "domain:*". Every permission a role grants must be
# listed under `permissions`. Note: `admin` deliberately does NOT include identity:view_sensitive.
# identity:process (run OCR on an ID-card image pair) is granted ONLY to the dedicated `identity_processor` role;
# no other role has it, and the role is not a default for anyone.

permissions:
  - onboarding:own
  - demo:deposit
  - identity:approve_account
  - identity:read_own_upload
  - assistant:use
  - rag:read
  - rag:write
  - identity:submit
  - identity:read
  - identity:view_sensitive
  - identity:review
  - identity:process
  - audit:read
  - admin:manage

roles:
  customer:
    - identity:read_own_upload
    - assistant:use
    - rag:read
  knowledge_user:
    - rag:read
    - rag:write
  operator:
    - identity:submit
    - identity:read
  reviewer:
    - identity:read
    - identity:review
    - identity:view_sensitive
  auditor:
    - audit:read
  applicant:
    - onboarding:own
  demo_treasurer:
    - demo:deposit
  admin:
    - "admin:*"
    - demo:deposit
    - identity:approve_account
  identity_processor:
    - identity:process

  identity_reviewer:
    - identity:approve_account
