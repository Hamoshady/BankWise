# Application-wide settings. OCR-specific settings do not belong here.
#
# The environment is NOT set in this file: use BANKWISE_ENV=development|production. If it is unset the
# application assumes production. Secrets are never stored in files; see .env.example.

secrets:
  # Secrets that must be present AND strong (>= 32 characters, no placeholder text) when running in
  # production. The token service signs with jwt_secret (BANKWISE_JWT_SECRET).
  required_in_production: [jwt_secret]

# Access tokens (core/auth.py). HS256 is the only algorithm accepted. Keep the lifetime short: roles are
# carried in the token and a role change only takes effect when the token expires or is revoked.
auth:
  issuer: bankwise
  audience: bankwise-api
  access_token_ttl_seconds: 900    # 60 - 86400
  leeway_seconds: 10               # clock skew tolerance, 0 - 60

# Short-lived private storage for sensitive uploads (core/storage.py). Relative paths resolve against the
# process working directory; outputs/ is git-ignored. Files expire after ttl_seconds once purge_expired() runs.
storage:
  base_dir: outputs/secure
  ttl_seconds: 3600
  max_bytes: 10485760              # 10 MiB
  max_files: 1000                  # refuses new uploads beyond this many files

# In-memory limits for development and tests. Not shared across processes (see core/rate_limit.py).
rate_limits:
  rag_read:
    limit: 30
    window_seconds: 60
  rag_write:
    limit: 10
    window_seconds: 60
  auth_attempt:
    limit: 5
    window_seconds: 60
  # Two-factor login: generation/resend are charged per client and per account, verification per client
  # and per challenge (each challenge additionally allows at most 5 wrong codes).
  otp_generation:
    limit: 5
    window_seconds: 60
  otp_resend:
    limit: 3
    window_seconds: 300
  otp_verify:
    limit: 10
    window_seconds: 60
  identity_submit:
    limit: 10
    window_seconds: 60
  expensive:
    limit: 2
    window_seconds: 60
  identity_process:                # OCR is expensive: per-user budget
    limit: 5
    window_seconds: 60

# Durable, tamper-evident audit file (core/audit.py HashChainedFileAuditSink). Needs BANKWISE_AUDIT_HMAC_KEY.
# Production start-up (core/bootstrap.py) refuses to run without this section. Single process only.
audit:
  base_dir: outputs/audit
  filename: audit.jsonl
  max_bytes: 52428800              # 50 MiB; writes FAIL when full (nothing is dropped or rotated silently)

# Operator statement for production: exactly one application process runs. Rate limits and token revocation
# live in that process's memory; set to true only if that is really the deployment. Leave false/absent otherwise.
deployment:
  single_process: false

# Limits for processing an ID-card image pair (integration/identity_processing.py). Images larger than
# max_image_bytes, larger than max_pixels, smaller than min_side_pixels, or not JPEG/PNG are refused before OCR.
# max_concurrent caps simultaneous OCR runs (GPU/CPU memory); extra requests get a rate-limit error.
identity_processing:
  max_image_bytes: 5242880         # 5 MiB per image
  max_pixels: 25000000             # 25 megapixels
  min_side_pixels: 100
  rate_policy: identity_process
  max_concurrent: 1
