[project]
name = "bankwise"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "pydantic>=2",
    "pyyaml",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]