name: bankwise-windows-snapshot
x-runtime: &runtime
  env_file: runtime.env
  environment:
    BANKWISE_DATABASE_URL: postgresql+psycopg://bankwise:${POSTGRES_PASSWORD}@db:5432/bankwise_ai
    BANKWISE_DATABASE_SCHEMA: ${BANKWISE_DATABASE_SCHEMA:-bankwise_api}
    BANKWISE_LLAMA_URL: http://127.0.0.1:8081
    BANKWISE_OCR_USE_GPU: "0"
    BANKWISE_OCR_BACKEND: easyocr
    BANKWISE_OCR_MODEL_DIR: /models
    BANKWISE_RAG_MODEL_DIR: /rag-models
services:
  db:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: bankwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bankwise_ai
    volumes:
      - db:/var/lib/postgresql/data
      - ./snapshot:/snapshot:ro
      - ./restore.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bankwise -d bankwise_ai && test -f "$$PGDATA/bankwise_snapshot_restored"']
      interval: 5s
      retries: 120
    restart: unless-stopped
  initialize:
    <<: *runtime
    image: bankwise-windows:api-20261122
    pull_policy: never
    user: root
    volumes:
      - outputs:/app/outputs
      - ./snapshot:/snapshot:ro
    command: [python, /opt/share/initialize.py]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *runtime
    image: bankwise-windows:api-20261122
    pull_policy: never
    volumes:
      - outputs:/app/outputs
      - ./models/ocr:/models:ro
      - ./models/rag:/rag-models:ro
      - ./models/llm:/llm-models:ro
    command: [python, /opt/share/serve.py]
    depends_on:
      initialize: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3)"]
      start_period: 300s
      interval: 10s
      retries: 90
    restart: unless-stopped
  ui:
    image: bankwise-windows:ui-20261122
    pull_policy: never
    environment:
      BANKWISE_API_URL: http://api:8000
    command: [streamlit, run, ui/app.py, --server.address=0.0.0.0, --server.port=8501, --server.headless=true, --browser.gatherUsageStats=false, --server.maxUploadSize=5]
    ports: ["127.0.0.1:${BANKWISE_UI_PORT:-8501}:8501"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  db:
  outputs:
